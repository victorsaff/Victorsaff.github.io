<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<meta http-equiv="refresh" content="300">
<title>Rental Command Center</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #05070f;
    --ink: #e7fbff;
    --muted: #8fd0e0;
    --card: rgba(8, 20, 40, .72);
    --line: rgba(0, 229, 255, .38);
    --good: #3ee0ff;
    --pending: #ffb020;
    --danger: #ff5d73;
    --airbnb: #ff5a5f;
    --booking: #1a56db;
    --agoda: #fb923c;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: Rajdhani, "Segoe UI", sans-serif;
    font-weight: 600;
    background:
      linear-gradient(rgba(0, 229, 255, .05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0, 229, 255, .05) 1px, transparent 1px),
      radial-gradient(900px 420px at 0% -10%, rgba(0, 180, 255, .22), transparent 55%),
      #05070f;
    background-size: 28px 28px, 28px 28px, auto, auto;
    color: var(--ink);
    line-height: 1.45;
  }
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    background: repeating-linear-gradient(to bottom, transparent 0 3px, rgba(0, 0, 0, .16) 3px 4px);
    z-index: 0;
  }
  .wrap { position: relative; z-index: 1; max-width: 1100px; margin: 0 auto; padding: 12px 12px 64px; }
  h1, h2, .jumps button, .card-label { font-family: Orbitron, Rajdhani, sans-serif; letter-spacing: .04em; }
  h1 { font-size: 22px; line-height: 1.2; margin: 0 0 6px; text-shadow: 0 0 16px rgba(0, 229, 255, .45); }
  h2 { font-size: 16px; margin: 0 0 8px; }
  h3 { font-size: 15px; margin: 12px 0 6px; }
  a { color: #93c5fd; }
  p { margin: 6px 0; }
  .hero, .panel, .card, .month, .kpi-card, .chart-card, .stay {
    background: rgba(8, 20, 40, .72);
    border: 1px solid rgba(0, 229, 255, .38);
    border-radius: 16px;
    box-shadow: 0 0 18px rgba(0, 180, 255, .12), inset 0 0 24px rgba(0, 180, 255, .05);
    backdrop-filter: blur(10px);
  }
  .hero { padding: 14px; }
  .stripes { display: flex; height: 6px; border-radius: 99px; overflow: hidden; margin-bottom: 12px; }
  .stripes span { flex: 1; }
  .eyebrow, .note, .range, .kpi-note { color: var(--muted); font-size: 13px; }
  .checked time { font-weight: 700; }
  .pills { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  .pill { display: inline-flex; align-items: center; gap: 6px; min-height: 32px; padding: 4px 10px; border-radius: 999px; border: 1px solid var(--line); background: var(--bg); font-size: 12px; font-weight: 750; }
  .pill i { width: 8px; height: 8px; border-radius: 99px; background: var(--pending); }
  .pill.ok i { background: #4ade80; box-shadow: 0 0 6px #4ade80; }
  .pill.bad i { background: var(--danger); }
  .jumps {
    display: flex; gap: 8px; overflow-x: auto; padding: 10px 0;
    position: sticky; top: 0; z-index: 5;
    background: color-mix(in srgb, var(--bg) 92%, transparent);
  }
  .jumps button {
    flex: 0 0 auto; text-decoration: none; color: var(--ink); font: inherit; cursor: pointer;
    border: 1px solid var(--line); background: var(--card);
    border-radius: 999px; padding: 8px 12px; min-height: 40px; font-size: 14px; font-weight: 700;
  }
  .jumps button.is-on { background: rgba(0, 229, 255, .16); border-color: #7af6ff; color: #e7fbff; box-shadow: 0 0 12px rgba(0, 229, 255, .45); }
  .tab-panel { display: none; }
  .tab-panel.is-on { display: block; animation: rise .32s ease; }
  @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  .kpi-card, .chart-card, .stay, .panel { transition: transform .18s ease, border-color .18s ease; }
  .kpi-card:hover, .chart-card:hover, .stay:hover { transform: translateY(-2px); border-color: #3d5278; }
  .kpi-card:active, .chart-card:active { transform: translateY(0) scale(.99); }
  .chart-box { position: relative; height: 220px; }
  .chart-tools { display: flex; gap: 8px; margin: 6px 0; }
  .panel { padding: 14px; margin: 12px 0; }
  #tomorrow { border-color: #f0b35e; }
  .tomorrow-date { font-size: 22px; font-weight: 750; margin: 0 0 8px; }
  .kpi-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-top: 12px; }
  .kpi-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(148px, 1fr)); gap: 10px; }
  .kpi-card { padding: 12px; }
  .gauges { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px; }
  .gauge { margin: 0; text-align: center; }
  .gauge svg { width: min(140px, 42vw); height: auto; }
  .gauge-track { fill: none; stroke: rgba(0, 229, 255, .15); stroke-width: 8; }
  .gauge-value { fill: none; stroke: #3ee0ff; stroke-width: 8; stroke-linecap: round; transform: rotate(-90deg); transform-origin: 60px 60px; filter: drop-shadow(0 0 6px rgba(0, 229, 255, .7)); }
  .gauge.amber .gauge-value { stroke: #ffb020; filter: drop-shadow(0 0 6px rgba(255, 176, 32, .7)); }
  .gauge-num { fill: #e7fbff; font-size: 18px; font-family: Orbitron, sans-serif; }
  .gauge-sub { fill: #8fd0e0; font-size: 8px; font-family: Orbitron, sans-serif; letter-spacing: .08em; }
  .gauge figcaption { color: var(--muted); font-size: 12px; }
  .card-label { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
  .card-gross { font-size: 19px; font-weight: 700; margin-top: 4px; }
  .card-gross span, .card-net span, .kpi-plat span { font-size: 11px; font-weight: 400; color: var(--muted); }
  .card-net { font-size: 15px; color: var(--good); font-weight: 600; }
  .kpi-extra { font-size: 12px; color: var(--muted); margin-top: 4px; }
  .kpi-plat { display: none; font-size: 11px; color: var(--muted); margin-top: 3px; }
  .kpi-cards.show-platforms .kpi-plat { display: block; }
  .charts { display: grid; grid-template-columns: 1fr; gap: 10px; margin-top: 10px; }
  .chart-card { background: #121826; border: 1px solid var(--line); border-radius: 10px; padding: 10px; }
  .chart-card svg { width: 100%; height: 84px; display: block; }
  .chart-card rect.bar { fill: var(--good); }
  .stay, .lane { margin: 8px 0; }
  .stay { border: 1px solid var(--line); border-left: 5px solid var(--muted); border-radius: 12px; padding: 10px 12px; background: #121826; }
  .stay header, .health header, .chat header { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .badge, .tag, .same-pill, .gap-pill { display: inline-flex; align-items: center; min-height: 22px; border-radius: 999px; padding: 2px 8px; font-size: 12px; font-weight: 750; }
  .tag { background: var(--bg); color: var(--ink); border: 1px solid var(--line); }
  .room-name { display: inline-flex; align-items: center; gap: 6px; font-weight: 750; }
  .room-name i { width: 10px; height: 10px; border-radius: 99px; display: inline-block; }
  .money, .note { font-size: 13px; color: var(--muted); }
  .pending { color: var(--pending); font-weight: 750; }
  .good { color: var(--good); font-weight: 750; }
  .same { color: #1c1004; background: #f0b35e; display: inline-block; border-radius: 999px; padding: 2px 8px; font-size: 12px; font-weight: 800; }
  .filters { display: grid; grid-template-columns: 1fr; gap: 8px; margin-bottom: 8px; }
  .filters input, .filters select, .price-form input, .price-form select, textarea {
    width: 100%; box-sizing: border-box; min-height: 44px; font: inherit; padding: 8px;
    border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--ink);
  }
  textarea { min-height: 64px; }
  .gscroll { overflow-x: auto; -webkit-overflow-scrolling: touch; border: 1px solid var(--line); border-radius: 12px; }
  .ggrid { display: grid; grid-auto-rows: minmax(72px, auto); }
  .ghead, .groom, .gcell { border-bottom: 1px solid var(--line); border-right: 1px solid var(--line); }
  .ghead, .groom { position: sticky; left: 0; z-index: 2; background: #121826; }
  .ghead { z-index: 3; font-size: 10px; color: var(--muted); text-align: center; padding: 4px 0; }
  .ghead.corner { z-index: 4; }
  .groom { display: flex; align-items: center; padding: 6px; font-size: 13px; font-weight: 750; }
  .gcell { min-width: 54px; background: var(--bg); color: var(--ink); padding: 3px; display: flex; flex-direction: column; gap: 2px; font: inherit; text-align: left; }
  .gcell.is-selected { outline: 2px solid var(--good); outline-offset: -2px; }
  .gcell.has-price-request { box-shadow: inset 0 -3px 0 #93c5fd; }
  .gbar { height: 6px; border-radius: 99px; background: transparent; }
  .gprices { font-size: 9px; line-height: 1.2; color: var(--muted); }
  .price-board { display: grid; grid-template-columns: 1fr; gap: 8px; }
  .price-room { border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; background: var(--bg); }
  .price-form { display: grid; gap: 8px; }
  .price-checks { display: flex; flex-wrap: wrap; gap: 8px; border: 0; margin: 0; padding: 0; }
  .price-checks label { min-height: 44px; display: flex; align-items: center; gap: 6px; font-weight: 650; }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  .btn { flex: 1 1 120px; text-align: center; text-decoration: none; font-weight: 800; min-height: 44px; padding: 12px 14px; border-radius: 999px; border: 0; cursor: pointer; }
  .btn.approve { background: var(--good); color: #052e16; }
  .btn.skip { border: 1px solid var(--line); color: var(--ink); background: transparent; }
  .thread-row .btn, .stay-note-send, .note-send { flex: none; }
  .list { list-style: none; padding: 0; margin: 0; display: grid; gap: 8px; }
  .choice { padding-left: 18px; }
  .meter { display: grid; grid-template-columns: 88px 1fr auto; gap: 8px; align-items: center; margin: 6px 0; font-size: 13px; }
  .track { height: 8px; background: var(--bg); border-radius: 99px; overflow: hidden; border: 1px solid var(--line); }
  .fill { height: 100%; border-radius: 99px; }
  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; min-width: 560px; }
  th, td { padding: 7px 8px; border-bottom: 1px solid var(--line); text-align: right; font-size: 14px; white-space: nowrap; }
  th:first-child, td:first-child, th:nth-child(2), td:nth-child(2) { text-align: left; }
  th { color: var(--muted); font-size: 12px; text-transform: uppercase; }
  .callout { border: 1px solid var(--pending); border-radius: 12px; padding: 10px 12px; }
  .empty { color: var(--muted); }
  .foot { color: var(--muted); font-size: 13px; margin-top: 28px; }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
    .gauge-value { filter: none; }
  }
  .day:focus-visible, .gcell:focus-visible, .btn:focus-visible, .jumps a:focus-visible { outline: 3px solid #93c5fd; outline-offset: 2px; }
  @media (min-width: 720px) {
    .wrap { padding: 20px 20px 72px; }
    h1 { font-size: 34px; }
    .filters, .price-board, .charts { grid-template-columns: 1fr 1fr; }
    .filters { grid-template-columns: 1.4fr .8fr .8fr .8fr; }
  }
</style>
</head>
<body>
<main class="wrap" id="app"><p>Loading the rental board…</p></main>
<noscript><p>This board needs JavaScript to read rental/data.json.</p></noscript>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.6/dist/chart.umd.min.js"></script>
<script type="module" src="board.js"></script>
</body>
</html>
