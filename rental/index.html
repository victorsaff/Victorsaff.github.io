<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="refresh" content="300">
<title>Rental Command Center</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #0f1420;
    --ink: #e8ecf3;
    --muted: #8fa3bf;
    --card: #171e2e;
    --line: #26314a;
    --good: #4ade80;
    --pending: #f0b35e;
    --danger: #fb7185;
  }
  @media (prefers-color-scheme: light) {
    :root {
      color-scheme: light;
      --bg: #f4f6fa;
      --ink: #16202e;
      --muted: #52627a;
      --card: #ffffff;
      --line: #dde3ec;
      --good: #15803d;
      --pending: #b45309;
      --danger: #be123c;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--ink);
    line-height: 1.45;
  }
  .wrap { max-width: 980px; margin: 0 auto; padding: 16px 12px 48px; }
  h1 { font-size: 28px; line-height: 1.15; margin: 0 0 6px; }
  h2 { font-size: 20px; margin: 0 0 8px; }
  h3 { font-size: 16px; margin: 14px 0 6px; }
  h4 { font-size: 13px; margin: 12px 0 4px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
  a { color: #93c5fd; }
  p { margin: 6px 0; }
  .hero, .panel, .card, .month {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
  }
  .hero { padding: 16px; position: relative; overflow: hidden; }
  .stripes { display: flex; height: 6px; border-radius: 99px; overflow: hidden; margin-bottom: 12px; }
  .stripes span { flex: 1; }
  .eyebrow { margin: 0; color: var(--muted); font-size: 13px; text-transform: uppercase; letter-spacing: .06em; }
  .checked { font-size: 15px; margin: 8px 0; }
  .checked time, .foot time { font-weight: 700; }
  .sub, .note, .range { color: var(--muted); font-size: 14px; }
  .platforms { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  .jumps {
    display: flex; gap: 8px; overflow-x: auto; padding: 10px 0;
    position: sticky; top: 0; z-index: 3;
    background: color-mix(in srgb, var(--bg) 92%, transparent);
  }
  .jumps a {
    flex: 0 0 auto; text-decoration: none; color: var(--ink);
    border: 1px solid var(--line); background: var(--card);
    border-radius: 999px; padding: 8px 12px; min-height: 40px;
    font-size: 14px; font-weight: 650;
  }
  .room-grid, .health-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; margin: 8px 0 18px; }
  .card { padding: 12px; }
  .room-card h2 { font-size: 18px; }
  .room-card p { margin: 2px 0; color: var(--muted); font-size: 14px; }
  .panel { padding: 14px; margin: 14px 0; }
  #now { border-color: #6ea8fe; }
  #tomorrow {
    border-color: #f0b35e;
    background:
      linear-gradient(180deg, color-mix(in srgb, #f0b35e 22%, var(--card)), var(--card) 120px);
  }
  .tomorrow-date { font-size: 26px; font-weight: 750; margin: 0 0 10px; }
  .lane { margin: 10px 0 14px; }
  .stay { border: 1px solid var(--line); border-left: 5px solid var(--muted); border-radius: 12px; padding: 10px 12px; margin: 8px 0; }
  .stay header, .health header, .chat header { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .badge, .tag, .same-pill, .gap-pill {
    display: inline-flex; align-items: center; min-height: 22px;
    border-radius: 999px; padding: 2px 8px; font-size: 12px; font-weight: 750;
  }
  .tag { background: var(--bg); color: var(--ink); border: 1px solid var(--line); }
  .room-name { display: inline-flex; align-items: center; gap: 6px; font-weight: 750; }
  .room-name i, .legend i { width: 10px; height: 10px; border-radius: 99px; display: inline-block; }
  .money, .note { font-size: 13px; color: var(--muted); }
  .pending { color: var(--pending); font-weight: 750; }
  .good { color: var(--good); font-weight: 750; }
  .same { color: #1c1004; background: #f0b35e; display: inline-block; border-radius: 999px; padding: 2px 8px; font-size: 12px; font-weight: 800; }
  .same-pill { background: #f0b35e; color: #1c1004; }
  .gap-pill { background: var(--bg); color: var(--muted); border: 1px solid var(--line); }
  .empty { color: var(--muted); }
  .cancelled, .cancelled-card { text-decoration: line-through; text-decoration-thickness: 1px; }
  .cancelled-card { text-decoration: none; }
  .cancelled-card strong, .cancelled-card p:first-of-type { text-decoration: line-through; }
  .legend { display: flex; flex-wrap: wrap; gap: 12px; margin: 8px 0; }
  .month { padding: 10px; margin: 10px 0; }
  .weekdays, .week { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
  .weekdays span { text-align: center; color: var(--muted); font-size: 11px; text-transform: uppercase; }
  .day {
    min-height: 48px; border-radius: 10px; border: 1px solid var(--line);
    background: var(--bg); color: var(--ink); padding: 4px;
    display: flex; flex-direction: column; align-items: stretch; justify-content: space-between;
    font: inherit; text-align: left; position: relative;
  }
  button.day { cursor: pointer; }
  .day.pad, .day.out { background: transparent; color: var(--muted); opacity: .55; }
  .day .num { font-size: 13px; font-weight: 750; }
  .day .mark { position: absolute; top: 3px; right: 4px; font-size: 11px; color: #f0b35e; }
  .bars { display: flex; gap: 2px; min-height: 5px; }
  .bars i { flex: 1; height: 5px; border-radius: 99px; }
  .bars i.hollow { background: transparent; box-shadow: inset 0 0 0 2px currentColor; }
  .day.is-today { outline: 2px solid var(--good); outline-offset: -2px; }
  .day.is-selected { border-color: var(--ink); }
  .day:focus-visible, .btn:focus-visible, .jumps a:focus-visible { outline: 3px solid #93c5fd; outline-offset: 2px; }
  .detail { margin-top: 8px; }
  .list { list-style: none; padding: 0; margin: 0; display: grid; gap: 8px; }
  .turnover p, .log p { margin: 4px 0 0; }
  .occ { font-size: 16px; }
  .meter { display: grid; grid-template-columns: 92px 1fr auto; gap: 8px; align-items: center; margin: 6px 0; font-size: 13px; }
  .track { height: 8px; background: var(--bg); border-radius: 99px; overflow: hidden; border: 1px solid var(--line); }
  .fill { height: 100%; border-radius: 99px; }
  .table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; margin-top: 8px; }
  table { width: 100%; border-collapse: collapse; min-width: 640px; }
  th, td { padding: 7px 8px; border-bottom: 1px solid var(--line); text-align: right; font-size: 14px; white-space: nowrap; }
  th:first-child, td:first-child, th:nth-child(2), td:nth-child(2) { text-align: left; }
  th { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .04em; }
  .stated { padding-left: 18px; }
  .stated li { margin: 4px 0; }
  .callout { border: 1px solid var(--pending); border-radius: 12px; padding: 10px 12px; }
  .health.is-attention { border-color: var(--pending); }
  .health.is-clear { border-color: var(--good); }
  .kpi-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin: 12px 0 4px; }
  .kpi-card { background: color-mix(in srgb, var(--bg) 55%, var(--card)); border: 1px solid var(--line); border-radius: 10px; padding: 12px; }
  .kpi-card .card-label { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
  .kpi-card .card-gross { font-size: 19px; font-weight: 700; margin-top: 4px; }
  .kpi-card .card-gross span, .kpi-card .card-net span, .kpi-plat span { font-size: 11px; font-weight: 400; color: var(--muted); }
  .kpi-card .card-net { font-size: 15px; color: var(--good); font-weight: 600; }
  .kpi-plat { font-size: 11px; color: var(--muted); margin-top: 3px; line-height: 1.35; }
  .kpi-note { color: var(--muted); font-size: 12px; margin: 8px 0 0; }
  .thread-row { margin: 8px 0 0; }
  .thread-row .btn { flex: none; display: inline-block; }
  .actions { display: flex; gap: 8px; margin-top: 10px; }
  .btn {
    flex: 1; text-align: center; text-decoration: none; font-weight: 800;
    min-height: 44px; padding: 12px 14px; border-radius: 999px;
  }
  .btn.approve { background: var(--good); color: #052e16; }
  .btn.skip { border: 1px solid var(--line); color: var(--ink); }
  .choice { padding-left: 18px; }
  .gaps { margin-top: 8px; }
  .foot { color: var(--muted); font-size: 13px; margin-top: 28px; }
  .error { color: var(--danger); font-weight: 700; }
  @media (min-width: 720px) {
    .wrap { padding: 24px 20px 64px; }
    h1 { font-size: 34px; }
    .day { min-height: 64px; }
  }
</style>
</head>
<body>
<main class="wrap" id="app">
  <p>Loading the rental board…</p>
</main>
<noscript><p>This board needs JavaScript to read rental/data.json.</p></noscript>
<script type="module" src="board.js"></script>
</body>
</html>
