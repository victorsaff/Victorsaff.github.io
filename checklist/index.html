<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Victor's Day — Checklist</title>
<meta name="description" content="Victor's daily game plan: classes, Airbnb cleaning, 18 Puritan, Lynn, and the move. Check it off, one block at a time.">
<style>
  :root{
    --bg:#0d1117; --card:#161c26; --card2:#1c2534; --line:#2a3648;
    --txt:#eef2f7; --dim:#93a3b8; --acc:#ffb020; --good:#34d399; --bad:#f87171;
    --blue:#58a6ff; --violet:#a78bfa; --pink:#f472b6;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  body{margin:0; background:var(--bg); color:var(--txt); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; padding-bottom:110px}
  .wrap{max-width:640px; margin:0 auto; padding:16px 14px 0}
  header.top{display:flex; align-items:center; justify-content:space-between; gap:10px; margin-top:6px}
  .logo{font-weight:800; font-size:20px; letter-spacing:.2px}
  .logo span{color:var(--acc)}
  .dateline{color:var(--dim); font-size:13px; margin-top:2px}
  .navbtn{background:var(--card2); border:1px solid var(--line); color:var(--txt); border-radius:10px; padding:8px 12px; font-size:15px; cursor:pointer}
  .navbtn:active{transform:scale(.96)}
  .todaybtn{font-size:13px; color:var(--acc); border-color:#4d3a08}
  .progress-card{background:linear-gradient(135deg,#1a2334,#141a26); border:1px solid var(--line); border-radius:18px; padding:16px; margin-top:14px; display:flex; gap:16px; align-items:center}
  .ring{position:relative; width:92px; height:92px; flex:0 0 92px}
  .ring svg{transform:rotate(-90deg)}
  .ring .pct{position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center}
  .ring .pct b{font-size:24px; line-height:1}
  .ring .pct small{color:var(--dim); font-size:11px}
  .ptext{flex:1; min-width:0}
  .ptext .mot{font-size:17px; font-weight:700; line-height:1.25}
  .ptext .sub{color:var(--dim); font-size:13px; margin-top:5px; line-height:1.4}
  .bar{height:8px; background:#0a0e14; border-radius:99px; margin-top:10px; overflow:hidden}
  .bar i{display:block; height:100%; background:linear-gradient(90deg,var(--acc),var(--good)); border-radius:99px; transition:width .4s ease}
  .week{display:flex; gap:6px; margin-top:14px}
  .week .d{flex:1; text-align:center; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:7px 2px 6px; cursor:pointer}
  .week .d.sel{border-color:var(--acc); background:#231b08}
  .week .d.today .dw{color:var(--acc)}
  .week .dw{font-size:11px; color:var(--dim); text-transform:uppercase; letter-spacing:.5px}
  .week .dn{font-size:15px; font-weight:700; margin:1px 0 4px}
  .week .dot{height:5px; border-radius:99px; background:#0a0e14; margin:0 5px; overflow:hidden}
  .week .dot i{display:block; height:100%; background:var(--good)}
  .block{margin-top:20px}
  .block h2{font-size:13px; text-transform:uppercase; letter-spacing:1.2px; color:var(--dim); margin:0 2px 8px; display:flex; justify-content:space-between; align-items:baseline}
  .block h2 .bt{color:var(--txt); background:var(--card2); border:1px solid var(--line); padding:2px 8px; border-radius:99px; font-size:11px; letter-spacing:.3px; text-transform:none}
  .task{display:flex; gap:12px; align-items:flex-start; background:var(--card); border:1px solid var(--line); border-radius:14px; padding:12px; margin-bottom:8px; cursor:pointer; transition:border-color .15s, background .15s}
  .task:active{transform:scale(.995)}
  .box{flex:0 0 26px; width:26px; height:26px; border-radius:8px; border:2px solid #3d4f6a; margin-top:1px; display:flex; align-items:center; justify-content:center; font-size:16px; color:#08130c; transition:all .15s}
  .task.done .box{background:var(--good); border-color:var(--good)}
  .task.done .box::after{content:"✓"; font-weight:900}
  .task .tt{flex:1; min-width:0}
  .task .tt .tx{font-size:15px; line-height:1.35}
  .task.done .tt .tx{color:var(--dim); text-decoration:line-through}
  .task .tt .note{color:var(--dim); font-size:12.5px; margin-top:3px; line-height:1.4}
  .badge{display:inline-block; font-size:10.5px; font-weight:800; letter-spacing:.6px; padding:2px 7px; border-radius:99px; margin-bottom:5px; text-transform:uppercase}
  .b-top{background:#3a2403; color:var(--acc); border:1px solid #6b4a08}
  .b-class{background:#12283f; color:var(--blue); border:1px solid #1d4568}
  .b-clean{background:#0e2f26; color:var(--good); border:1px solid #14532d}
  .b-money{background:#33152b; color:var(--pink); border:1px solid #5b2149}
  .b-burton{background:#241a3f; color:var(--violet); border:1px solid #3d2a68}
  .b-lynn{background:#2b2118; color:#fb923c; border:1px solid #57350f}
  .b-move{background:#12303a; color:#22d3ee; border:1px solid #155e6b}
  .b-study{background:#2e2a10; color:#facc15; border:1px solid #57500f}
  .del{background:none; border:none; color:#54687f; font-size:18px; padding:2px 4px; cursor:pointer; line-height:1}
  .del:active{color:var(--bad)}
  .celebrate{display:none; margin-top:18px; text-align:center; background:linear-gradient(135deg,#123528,#0e2f26); border:1px solid #14532d; border-radius:18px; padding:20px 14px}
  .celebrate.show{display:block}
  .celebrate .big{font-size:26px; font-weight:900}
  .celebrate .sm{color:#a7f3d0; margin-top:5px; font-size:14px}
  .addbar{position:fixed; left:0; right:0; bottom:0; background:rgba(13,17,23,.92); backdrop-filter:blur(8px); border-top:1px solid var(--line); padding:10px 12px calc(10px + env(safe-area-inset-bottom))}
  .addbar .in{max-width:640px; margin:0 auto; display:flex; gap:8px}
  .addbar input{flex:1; background:var(--card); border:1px solid var(--line); color:var(--txt); border-radius:12px; padding:12px; font-size:15px; outline:none; min-width:0}
  .addbar input:focus{border-color:var(--acc)}
  .addbar select{background:var(--card); border:1px solid var(--line); color:var(--txt); border-radius:12px; padding:0 6px; font-size:13px; max-width:118px}
  .addbar button{background:var(--acc); color:#1a1205; border:none; font-weight:800; border-radius:12px; padding:0 16px; font-size:15px; cursor:pointer}
  .tools{display:flex; gap:8px; margin-top:16px}
  .tools button{flex:1; background:none; border:1px solid var(--line); color:var(--dim); border-radius:10px; padding:8px; font-size:12.5px; cursor:pointer}
  .foot{color:#54687f; font-size:12px; text-align:center; margin-top:18px; line-height:1.5}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <div class="logo">VICTOR'S DAY <span>✓</span></div>
      <div class="dateline" id="dateline"></div>
    </div>
    <div style="display:flex; gap:6px">
      <button class="navbtn" id="prev">‹</button>
      <button class="navbtn todaybtn" id="todayBtn">Today</button>
      <button class="navbtn" id="next">›</button>
    </div>
  </header>

  <div class="progress-card">
    <div class="ring">
      <svg width="92" height="92">
        <circle cx="46" cy="46" r="40" stroke="#0a0e14" stroke-width="9" fill="none"/>
        <circle id="ringfg" cx="46" cy="46" r="40" stroke="#34d399" stroke-width="9" fill="none" stroke-linecap="round" stroke-dasharray="251.3" stroke-dashoffset="251.3"/>
      </svg>
      <div class="pct"><b id="pct">0%</b><small>done</small></div>
    </div>
    <div class="ptext">
      <div class="mot" id="mot">Let's fucking go.</div>
      <div class="sub" id="psub"></div>
      <div class="bar"><i id="barfg" style="width:0%"></i></div>
    </div>
  </div>

  <div class="week" id="week"></div>
  <div id="blocks"></div>

  <div class="celebrate" id="celebrate">
    <div class="big">🏆 DAY CLEARED</div>
    <div class="sm">Every block checked. That's how you run a day, Victor.</div>
  </div>

  <div class="tools">
    <button id="resetDay">↺ Reset this day</button>
    <button id="clearDone">🧹 Uncheck all</button>
  </div>
  <div class="foot">Your checkmarks save on this phone/browser automatically.<br>Classes first · Cleaning before 2 PM · 18 Puritan · Lynn last · Study at night</div>
</div>

<div class="addbar">
  <div class="in">
    <input id="newtask" type="text" placeholder="Add a task… e.g. Buy paint for Dad" autocomplete="off">
    <select id="newblock"></select>
    <button id="addbtn">Add</button>
  </div>
</div>

<script>
"use strict";
/* ---------- date helpers ---------- */
const fmt = d => d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const parseD = s => { const [y,m,dd]=s.split("-").map(Number); return new Date(y, m-1, dd); };
const addDays = (d,n) => { const x=new Date(d); x.setDate(x.getDate()+n); return x; };
const WD = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
const MO = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];

/* ---------- blocks ---------- */
const BLOCKS = [
  {id:"early",   name:"🌅 Early",        time:"7:00 – 8:00"},
  {id:"morning", name:"☀️ Morning",      time:"8:00 – 12:00"},
  {id:"midday",  name:"🧹 Midday",       time:"12:00 – 2:00"},
  {id:"aft",     name:"🏗️ Afternoon",    time:"2:00 – 5:30"},
  {id:"eve",     name:"🌙 Evening",      time:"5:30 – 9:00"},
  {id:"night",   name:"📚 Night study",  time:"After 9:00"}
];
const BADGE = {top:["b-top","⭐ Top priority"], class:["b-class","🎓 Class"], clean:["b-clean","🧹 Cleaning"], money:["b-money","💳 Money"], burton:["b-burton","🏠 18 Puritan"], lynn:["b-lynn","📦 Lynn"], move:["b-move","🚚 Move"], study:["b-study","📚 Study"]};

/* study minutes: 45 to Nov 9, 90 Nov 10-17, light after exam */
function studyMin(ds){ if(ds<="2026-11-09") return 45; if(ds<="2026-11-17") return 90; return 30; }

/* ---------- weekly template by weekday (0=Sun) ---------- */
function template(dow, ds){
  const sm = studyMin(ds);
  const T = {early:[], morning:[], midday:[], aft:[], eve:[], night:[]};
  const plan = {id:"plan", tx:"Read today's plan, pick your Top 3", note:"2 minutes. Then move — no scrolling through life today."};
  if(dow===2){ /* Tuesday: lab 8 AM */
    T.early.push(plan, {id:"tolab", tx:"Get to UMass Boston — PHYSIC 171 lab at 8:00", note:"Wheatley-Peters W04-0074. Leave early, lab starts sharp."});
    T.morning.push({id:"physlab", tx:"PHYSIC 171 Lab — 8:00 to 10:30 AM", badge:"class", note:"Get your data + datasheet done in the room before you leave."});
    T.midday.push({id:"cleanwin", tx:"Cleaning window — finish any turnover by 2:00 PM", badge:"clean", note:"Somerville Airbnb. Check-in is 2 PM, firm."});
    T.aft.push({id:"burton1", tx:"18 Puritan — drop materials / help Dad", badge:"burton", note:"Dad's building it. Your job: materials there on time."},
               {id:"lynn1", tx:"Lynn block — warehouse + e-commerce, batched", badge:"lynn", note:"One trip, everything at once. Pickups at 732R Lynnway."});
    T.eve.push({id:"dinner", tx:"Eat + reset", note:"Real food. You've earned it."});
    T.night.push({id:"study", tx:"CHEM 116 Exam 3 study — "+sm+" min", badge:"study", note:"Exam 3 is Wed Nov 18. Small daily reps beat a midnight cram."});
  } else if(dow===1 || dow===3){ /* Mon / Wed: CHEM day */
    T.early.push(plan);
    T.morning.push({id:"burton1", tx:"18 Puritan — materials run for Dad", badge:"burton", note:"Right next to the Airbnb. Drop supplies, check what he needs next."});
    T.midday.push({id:"cleanwin", tx:"Cleaning window — finish any turnover by 2:00 PM", badge:"clean", note:"Somerville Airbnb. Check-in is 2 PM, firm."});
    if(dow===1) T.aft.push({id:"disc", tx:"CHEM 116 Discussion — 3:00 to 3:50 PM", badge:"class", note:"UHall Y03-3350."});
    T.aft.push({id:"lec", tx:"CHEM 116 Lecture — 4:00 to 5:15 PM", badge:"class", note:"UHall Y02-2300, Marmolejos."});
    T.eve.push({id:"dinner", tx:"Eat + reset", note:""});
    T.night.push({id:"study", tx:"CHEM 116 Exam 3 study — "+sm+" min", badge:"study", note: dow===1 ? "Tomorrow is the 8 AM physics lab — study, then early night." : "Exam 3 is Wed Nov 18."});
  } else if(dow===4){ /* Thursday: no classes */
    T.early.push(plan, {id:"thuplan", tx:"No classes today — this is your big work day", note:"18 Puritan, Lynn, reports. Stack it and knock it out."});
    T.morning.push({id:"burton1", tx:"18 Puritan — long block with Dad", badge:"burton", note:"Materials first, then help on site."});
    T.midday.push({id:"cleanwin", tx:"Cleaning window — finish any turnover by 2:00 PM", badge:"clean", note:"Somerville Airbnb. Check-in is 2 PM, firm."});
    T.aft.push({id:"lynn1", tx:"Lynn big block — warehouse, shipping, Marketplace pickups", badge:"lynn", note:"Batch everything. This is the day for it."});
    T.eve.push({id:"report", tx:"School desk work — lab reports / homework", badge:"study", note:"Use the quiet evening while it's fresh."});
    T.night.push({id:"study", tx:"CHEM 116 Exam 3 study — "+sm+" min", badge:"study", note:"Exam 3 is Wed Nov 18."});
  } else if(dow===5){ /* Friday: CHEM 118 lab */
    T.early.push(plan, {id:"prelab", tx:"Pre-lab prep before the 1 PM lab", badge:"study", note:"Read the lab once through. No surprises in the room."});
    T.morning.push({id:"burton1", tx:"18 Puritan — quick materials drop for Dad", badge:"burton", note:"Keep it short — lab day."});
    T.midday.push({id:"cleanwin", tx:"Cleaning window — turnover done BEFORE you leave for lab", badge:"clean", note:"Check-in is 2 PM but you're in lab at 1. Finish by 12:30."},
                 {id:"chemlab", tx:"CHEM 118 Lab — 1:00 to 5:00 PM", badge:"class", note:"UHall Y03-3130, Sadira Walker. Datasheet done in the room."});
    T.eve.push({id:"dinner", tx:"Eat + reset", note:"Lab Fridays are long. Recover."});
    T.night.push({id:"study", tx:"Light review — "+Math.min(sm,30)+" min max", badge:"study", note:"Friday rule: light only. Weekend carries the rest."});
  } else { /* Sat / Sun */
    T.early.push(plan);
    T.morning.push({id:"burton1", tx:"18 Puritan — work block with Dad", badge:"burton", note:"Weekend = biggest progress at 18 Puritan. Materials run first."});
    T.midday.push({id:"cleanwin", tx:"Cleaning window — finish any turnover by 2:00 PM", badge:"clean", note:"Weekend turnovers are the busy ones. 2 PM, firm."});
    T.aft.push({id:"lynn1", tx:"Lynn block — pickups + e-commerce catch-up", badge:"lynn", note:"Batched, then done."});
    T.eve.push({id:"study", tx:"Study / lab report block — "+sm+" min", badge:"study", note:"Exam 3 is Wed Nov 18."});
    T.night.push({id:"rest", tx:"Actually rest", note:"Recovery is part of the system, not a reward."});
  }
  return T;
}

/* ---------- dated, real-life tasks (verified bookings / deadlines) ---------- */
const DATED = {
  "2026-11-03":[
    {block:"morning", id:"mtg", tx:"Meeting after lab", note:"You put this between lab and cleaning — keep it tight."},
    {block:"midday", id:"antoine", tx:"Room 2 turnover: Thomas out → Antoine Canonne in", badge:"clean", top:1, note:"Booking.com, Nov 3–4, $108. Clean done before 2 PM check-in."},
    {block:"aft", id:"ebayship", tx:"Ship eBay order 10-15376-32237", badge:"lynn", note:"Ship-by today."},
    {block:"eve", id:"parafin", tx:"Decide Parafin — $600 was due Nov 1", badge:"money", top:1, note:"Card authorization form still empty. Send the form or the fallback note to Alex. Your call, but today."},
    {block:"eve", id:"storage", tx:"Shortlist one storage unit near Somerville/Lynn", badge:"move", note:"Lynn move-out is Nov 30 — 27 days. Small step, big relief later."}
  ],
  "2026-11-04":[
    {block:"midday", id:"graham", tx:"Graham check-in today (Airbnb, $97.17) — room ready by 2 PM", badge:"clean", top:1, note:"New booking from the Nov 2 rentals check."},
    {block:"midday", id:"saraout", tx:"Sara Mckenzie checks out (Room 1) — turnover if rebooked", badge:"clean", note:"Her stay ran Oct 28 – Nov 4."}
  ],
  "2026-11-05":[
    {block:"early", id:"bofa9344", tx:"PAY BofA Business card ending 9344 — due TODAY", badge:"money", top:1, note:"Amount is portal-only — check it, pay it, screenshot it."},
    {block:"midday", id:"jacob", tx:"Jacob check-in, Room 1 (Nov 5–6, 2 guests) — ready by 2 PM", badge:"clean", note:"Airbnb booking."},
    {block:"aft", id:"cccheck", tx:"Glance at card list: BofA 1671 $35 min is due Nov 11", badge:"money", note:"Thursday = no classes. Money admin fits here."}
  ],
  "2026-11-06":[
    {block:"early", id:"phquiz", tx:"CHEM 118 Pre-Lab Quiz — pH Measurement & Titration, due 1:00 PM", badge:"class", top:1, note:"5 pts. Do it BEFORE lab, not in the hallway."},
    {block:"eve", id:"labnotes", tx:"Write pH lab notes while fresh — report due Nov 12 (75 pts)", badge:"study", note:"30 min of notes tonight saves 3 hours next week."}
  ],
  "2026-11-09":[
    {block:"midday", id:"christophe", tx:"Christophe Robert check-in, Room 2 (Nov 9–11, $225) — ready by 2 PM", badge:"clean", top:1, note:"Booking.com res 5142884207."}
  ],
  "2026-11-10":[
    {block:"midday", id:"nil", tx:"Nil check-in, Room 1 (Nov 10–12, Airbnb) — ready by 2 PM", badge:"clean", note:"Driving from NJ, needs parking permit."},
    {block:"night", id:"ramp", tx:"Exam 3 ramp starts: 90 min/day from today to Nov 17", badge:"study", top:1, note:"8 days out. This week decides the grade."}
  ],
  "2026-11-11":[
    {block:"early", id:"bofa1671", tx:"PAY BofA card ending 1671 — $35 minimum due TODAY", badge:"money", top:1, note:"Pay it before classes, forget it by dinner."}
  ],
  "2026-11-12":[
    {block:"eve", id:"phreport", tx:"CHEM 118 pH Lab Report DUE 11:59 PM (75 pts)", badge:"class", top:1, note:"Thursday, no classes — desk block in the afternoon, submit before dinner if you can."}
  ],
  "2026-11-14":[
    {block:"morning", id:"storagebook", tx:"Book the storage unit", badge:"move", top:1, note:"16 days to Lynn move-out. Booked = one less thing screaming."},
    {block:"aft", id:"pack1", tx:"Move: pack ONE room / corner in Lynn", badge:"move", note:"Boxes labeled. Future-you says thanks."}
  ],
  "2026-11-15":[
    {block:"midday", id:"luke", tx:"Luke check-in (Airbnb, Nov 15–16, $105.62) — room ready by 2 PM", badge:"clean", note:"From the verified reservations list."}
  ],
  "2026-11-18":[
    {block:"aft", id:"exam3", tx:"⭐ CHEM 116 EXAM 3 — TODAY", badge:"class", top:1, note:"You've been repping this for two weeks. Walk in calm, walk out done."},
    {block:"eve", id:"eqdraft", tx:"After the exam: open the Equilibrium draft — due TOMORROW", badge:"study", note:"Just open it and outline. 20 min tonight saves Thursday."}
  ],
  "2026-11-19":[
    {block:"eve", id:"eqfinal", tx:"CHEM 118 Equilibrium FINAL draft DUE 11:59 PM (50 pts)", badge:"class", top:1, note:"Thursday, no classes. Submit before dinner."}
  ],
  "2026-11-21":[
    {block:"morning", id:"nugenix", tx:"Amazon deadline: Nugenix FBA inventory removal (~today)", badge:"money", top:1, note:"30 days from the Oct 22 notice — remove it or Amazon may dispose of it."},
    {block:"aft", id:"pack2", tx:"Move: big pack day — 9 days to Lynn move-out", badge:"move", note:"Storage runs count. Get the heavy stuff moved."}
  ],
  "2026-11-28":[
    {block:"morning", id:"adspower", tx:"AdsPower plan expires today — renew decision", badge:"money", note:"3 profiles run your businesses. Don't let it lapse by accident."},
    {block:"aft", id:"pack3", tx:"Move: Lynn almost empty — final sweep weekend", badge:"move", note:"Out by Monday Nov 30."}
  ],
  "2026-11-30":[
    {block:"early", id:"moveout", tx:"⭐ LYNN MOVE-OUT — done by today", badge:"move", top:1, note:"Keys, final walk-through, last load to storage / 18 Puritan."}
  ],
  "2026-12-09":[
    {block:"aft", id:"exam4", tx:"⭐ CHEM 116 EXAM 4 — TODAY", badge:"class", top:1, note:"Lowest of the 4 exams gets dropped. Finish strong anyway."}
  ],
  "2026-12-21":[
    {block:"eve", id:"ewrap", tx:"CAS 014 EWRAP Portfolio DUE 11:59 PM", badge:"class", top:1, note:"Last school item of the semester."}
  ]
};
/* Saturday move-pack reminders in November */
function datedFor(ds){
  const out = (DATED[ds]||[]).slice();
  const d = parseD(ds);
  if(d.getDay()===6 && ds>="2026-11-07" && ds<="2026-11-28" && !out.some(t=>t.badge==="move"))
    out.push({block:"aft", id:"packsat", tx:"Move: Saturday pack / storage run", badge:"move", note:"Lynn out by Nov 30. One run every Saturday."});
  return out;
}

/* ---------- state (per-day, saved in this browser) ---------- */
const LS = "victor-day-v1-";
function loadState(ds){
  try{ return JSON.parse(localStorage.getItem(LS+ds)) || {}; }catch(e){ return {}; }
}
function saveState(ds, st){ try{ localStorage.setItem(LS+ds, JSON.stringify(st)); }catch(e){} }
function dayTasks(ds){
  const d = parseD(ds), st = loadState(ds);
  const base = template(d.getDay(), ds);
  const all = {};
  BLOCKS.forEach(b=> all[b.id]=[]);
  Object.keys(base).forEach(k=> base[k].forEach(t=> all[k].push(Object.assign({src:"seed"}, t))));
  datedFor(ds).forEach(t=> all[t.block].push(Object.assign({src:"seed"}, t)));
  (st.custom||[]).forEach(t=> { if(all[t.block]) all[t.block].push(t); });
  const gone = new Set(st.deleted||[]);
  Object.keys(all).forEach(k=> all[k]=all[k].filter(t=> !gone.has(ds+"|"+k+"|"+t.id)));
  return {all, st};
}

/* ---------- render ---------- */
let cur = fmt(new Date());
const $ = id => document.getElementById(id);
const MOTS = [[0,"Let's fucking go."],[1,"First check. Momentum started."],[25,"Rolling. Keep stacking checks."],[50,"Halfway there — don't let up."],[75,"Almost cleared. Finish the board."],[99,"One more. Close it out."],[100,"🏆 DAY CLEARED"]];
function render(){
  const d = parseD(cur), st0 = loadState(cur);
  $("dateline").textContent = WD[d.getDay()]+", "+MO[d.getMonth()]+" "+d.getDate()+", "+d.getFullYear() + (cur===fmt(new Date()) ? " · Today" : "");
  /* week strip: today-centered 7 days starting Monday of this week */
  const monday = addDays(d, -((d.getDay()+6)%7));
  let wh="";
  for(let i=0;i<7;i++){
    const dd = addDays(monday,i), ds = fmt(dd);
    const {all, st} = dayTasks(ds);
    let tot=0, dn=0;
    Object.values(all).forEach(a=>a.forEach(t=>{ tot++; if((st.done||{})[ds+"|"+t.id]) dn++; }));
    const p = tot? Math.round(dn/tot*100):0;
    wh += '<div class="d'+(ds===cur?" sel":"")+(ds===fmt(new Date())?" today":"")+'" data-d="'+ds+'"><div class="dw">'+WD[dd.getDay()].slice(0,3)+'</div><div class="dn">'+dd.getDate()+'</div><div class="dot"><i style="width:'+p+'%"></i></div></div>';
  }
  $("week").innerHTML = wh;
  document.querySelectorAll(".week .d").forEach(el=> el.onclick = ()=>{ cur = el.dataset.d; render(); window.scrollTo({top:0, behavior:"smooth"}); });
  /* blocks */
  const {all, st} = dayTasks(cur);
  const done = st.done||{};
  let tot=0, dn=0, html="";
  $("newblock").innerHTML = BLOCKS.map(b=>'<option value="'+b.id+'">'+b.name.replace(/^[^ ]+ /,"")+" "+b.time+"</option>").join("");
  BLOCKS.forEach(b=>{
    const tasks = all[b.id];
    if(!tasks.length) return;
    html += '<div class="block"><h2>'+b.name+'<span class="bt">'+b.time+'</span></h2>';
    tasks.forEach(t=>{
      const key = cur+"|"+t.id, isDone = !!done[key];
      tot++; if(isDone) dn++;
      const bd = t.badge && BADGE[t.badge] ? '<span class="badge '+BADGE[t.badge][0]+'">'+BADGE[t.badge][1]+"</span>" : "";
      const top = t.top ? '<span class="badge b-top">⭐ Top</span> ' : "";
      html += '<div class="task'+(isDone?" done":"")+'" data-block="'+b.id+'" data-id="'+t.id+'"><div class="box"></div><div class="tt">'+top+bd+'<div class="tx">'+t.tx+"</div>"+(t.note?'<div class="note">'+t.note+"</div>":"")+'</div><button class="del" title="Remove">×</button></div>';
    });
    html += "</div>";
  });
  $("blocks").innerHTML = html || '<div class="foot" style="margin-top:30px">Nothing on this day yet — add one below.</div>';
  const pct = tot? Math.round(dn/tot*100):0;
  $("pct").textContent = pct+"%";
  $("barfg").style.width = pct+"%";
  $("ringfg").style.strokeDashoffset = String(251.3 - 251.3*pct/100);
  $("ringfg").style.stroke = pct===100 ? "#34d399" : pct>=50 ? "#ffb020" : "#58a6ff";
  let mot = MOTS[0][1];
  MOTS.forEach(m=>{ if(pct>=m[0]) mot=m[1]; });
  $("mot").textContent = mot;
  $("psub").textContent = dn+" of "+tot+" checked off" + (tot-dn>0 ? " · "+(tot-dn)+" to go" : " · nothing left");
  $("celebrate").className = "celebrate" + (pct===100 && tot>0 ? " show":"");
  document.querySelectorAll(".task").forEach(el=>{
    el.addEventListener("click", e=>{
      if(e.target.classList.contains("del")) return;
      const s = loadState(cur); s.done = s.done||{};
      const key = cur+"|"+el.dataset.id;
      if(s.done[key]) delete s.done[key]; else s.done[key]=1;
      saveState(cur, s); render();
    });
    el.querySelector(".del").addEventListener("click", e=>{
      e.stopPropagation();
      const s = loadState(cur); s.deleted = s.deleted||[];
      s.deleted.push(cur+"|"+el.dataset.block+"|"+el.dataset.id);
      if(s.done) delete s.done[cur+"|"+el.dataset.id];
      saveState(cur, s); render();
    });
  });
}
$("prev").onclick = ()=>{ cur = fmt(addDays(parseD(cur),-1)); render(); };
$("next").onclick = ()=>{ cur = fmt(addDays(parseD(cur), 1)); render(); };
$("todayBtn").onclick = ()=>{ cur = fmt(new Date()); render(); window.scrollTo({top:0, behavior:"smooth"}); };
function addTask(){
  const v = $("newtask").value.trim(); if(!v) return;
  const s = loadState(cur); s.custom = s.custom||[];
  s.custom.push({block: $("newblock").value, id:"c"+Date.now(), tx: v.replace(/</g,"&lt;"), note:"", src:"custom"});
  saveState(cur, s); $("newtask").value=""; render();
}
$("addbtn").onclick = addTask;
$("newtask").addEventListener("keydown", e=>{ if(e.key==="Enter") addTask(); });
$("resetDay").onclick = ()=>{ if(confirm("Reset this day? Seed tasks come back, checkmarks and your added tasks clear.")){ localStorage.removeItem(LS+cur); render(); } };
$("clearDone").onclick = ()=>{ const s = loadState(cur); s.done={}; saveState(cur,s); render(); };
render();
</script>
</body>
</html>
